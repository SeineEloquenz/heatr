[package]
name = "heatr-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "heatr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = [ "derive" ] }
indicatif = "0.18.4"
heatr = { path = "../heatr" }
pollster = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[package]
name = "heatr-jni"
version = "0.2.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]
name = "heatr_jni"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
heatr = { path = "../heatr" }
jni = "0.22.4"
libc = "0.2"
log = "0.4"
pollster = "1.0"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

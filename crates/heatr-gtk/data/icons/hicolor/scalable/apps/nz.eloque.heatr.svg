<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#e8472b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#aeb6c2"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4654"/>
      <stop offset="1" stop-color="#222933"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#00000018" stroke-width="4"/>

  <!-- Bug (top-down), pressed at center-low -->
  <g transform="translate(256 318)">
    <!-- legs -->
    <g stroke="#241c14" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M-58 -34 C -96 -52 -116 -50 -134 -64"/>
      <path d="M-62 0 C -104 0 -126 4 -148 2"/>
      <path d="M-58 34 C -96 52 -116 56 -132 72"/>
      <path d="M58 -34 C 96 -52 116 -50 134 -64"/>
      <path d="M62 0 C 104 0 126 4 148 2"/>
      <path d="M58 34 C 96 52 116 56 132 72"/>
    </g>
    <!-- antennae -->
    <g stroke="#241c14" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M-20 -64 C -34 -104 -44 -118 -64 -132"/>
      <path d="M20 -64 C 34 -104 44 -118 64 -132"/>
    </g>
    <!-- head -->
    <circle cx="0" cy="-62" r="26" fill="#2c2118"/>
    <!-- body -->
    <ellipse cx="0" cy="14" rx="74" ry="86" fill="#3a2c1f"/>
    <ellipse cx="0" cy="14" rx="74" ry="86" fill="none" stroke="#241c14" stroke-width="6"/>
    <!-- wing split + shells -->
    <path d="M0 -58 L0 92" stroke="#241c14" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-34" cy="-6" r="9" fill="#241c14"/>
    <circle cx="34" cy="-6" r="9" fill="#241c14"/>
    <circle cx="-30" cy="42" r="8" fill="#241c14"/>
    <circle cx="30" cy="42" r="8" fill="#241c14"/>
  </g>

  <!-- USB stick pressing down from upper-right -->
  <g transform="rotate(22 256 196)">
    <!-- stick body -->
    <rect x="214" y="70" width="84" height="150" rx="18" fill="url(#stick)"/>
    <rect x="214" y="70" width="84" height="150" rx="18" fill="none" stroke="#0f141b" stroke-width="4"/>
    <!-- keyring loop -->
    <circle cx="256" cy="92" r="13" fill="none" stroke="#aeb6c2" stroke-width="9"/>
    <!-- activity LED -->
    <circle cx="256" cy="150" r="9" fill="#ffd34d"/>
    <!-- metal USB-A connector, tip pressing the bug -->
    <rect x="226" y="214" width="60" height="78" rx="8" fill="url(#metal)"/>
    <rect x="226" y="214" width="60" height="78" rx="8" fill="none" stroke="#8a93a1" stroke-width="4"/>
    <rect x="238" y="238" width="36" height="40" rx="4" fill="#9aa3b1"/>
    <rect x="246" y="248" width="20" height="22" rx="3" fill="#6f7886"/>
  </g>

  <!-- heat shimmer above the contact point -->
  <g stroke="#fff3e0" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M196 250 q-12 -16 0 -32 q12 -16 0 -32"/>
    <path d="M226 268 q-12 -16 0 -32 q12 -16 0 -32"/>
  </g>
</svg>

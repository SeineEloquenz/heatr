[package]
name = "heatr-gtk"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "heatr-gtk"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_10"] }
heatr = { path = "../heatr" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
